{% extends "bills/base.html" %}
{% block content %}
  <p>Signed in as {{ user.get_username }}.</p>
  {% if user.is_staff %}<p><a href="{% url 'admin:index' %}">Administration</a></p>{% endif %}
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Sign out</button>
  </form>
{% endblock %}
