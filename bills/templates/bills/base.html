<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}House Bills{% endblock %}</title>
  </head>
  <body>
    <main>
      <h1>House Bills</h1>
      {% if user.is_authenticated %}
        <nav aria-label="Main"><a href="{% url 'bills:home' %}">Home</a> · <a href="{% url 'bills:documents' %}">Documents</a> · <a href="{% url 'bills:upload' %}">Upload invoice</a></nav>
      {% endif %}
      {% for message in messages %}<p role="status">{{ message }}</p>{% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
