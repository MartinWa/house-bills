{% extends "bills/base.html" %}
{% block title %}Sign in — House Bills{% endblock %}
{% block content %}
  <h2>Sign in</h2>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
