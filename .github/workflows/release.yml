name: Release image

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested release
    # Tag pushes create stable releases; manual prereleases and tag deletions are skipped.
    if: >-
      (github.event_name == 'push' && !github.event.deleted) ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    # Two emulated builds, each checked and scanned, plus the SBOM attestations.
    timeout-minutes: 90
    permissions:
      contents: write # Create or publish the GitHub Release for the tested tag.
      actions: read # Verify successful CI jobs for the exact release commit.
      packages: write # Publish the tested image and its attestation manifests to GHCR.
      id-token: write # Obtain the identity used to sign provenance and SBOM attestations.
      attestations: write # Store build provenance and SBOM attestations.
    env:
      # The Git tag is the release version; no package-version bump is required.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.release.tag_name }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable tag on a tested main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_CREATED: ${{ github.event.created }}
        run: python3 tools/publish_release.py --check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an existing version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          package=${GITHUB_REPOSITORY#*/}
          if gh api --paginate "users/$owner/packages/container/${package,,}/versions" \
            --jq '.[].metadata.container.tags[]' > "$RUNNER_TEMP/image-tags" 2> "$RUNNER_TEMP/registry-error"; then
            if grep -Fxq "$VERSION" "$RUNNER_TEMP/image-tags"; then
              echo "Image version already exists; create a new release instead." >&2
              exit 1
            fi
          else
            # Before the first publication, the package does not exist yet.
            grep -Fq '(HTTP 404)' "$RUNNER_TEMP/registry-error"
          fi
      - name: Build the amd64 image by digest
        id: amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          # Rebuild from scratch so the published image carries current OS packages.
          no-cache: true
          outputs: type=image,name=${{ steps.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            HOUSE_BILLS_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=ci-production
          github-token: ""
      - name: Build the arm64 image by digest
        id: arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          # Rebuild from scratch so the published image carries current OS packages.
          no-cache: true
          outputs: type=image,name=${{ steps.release.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            HOUSE_BILLS_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=ci-production
          github-token: ""
      - name: Check the amd64 image and generate its SBOM
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.amd64.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          SBOM: ${{ runner.temp }}/sbom-amd64.spdx.json
          PLATFORM: linux/amd64
        run: bash tools/check_release_image.sh
      - name: Check the arm64 image and generate its SBOM
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.arm64.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          SBOM: ${{ runner.temp }}/sbom-arm64.spdx.json
          PLATFORM: linux/arm64
          # QEMU runs Python an order of magnitude slower than the native builder.
          TIMEOUT_SCALE: "20"
        run: bash tools/check_release_image.sh
      - name: Publish the tested index
        id: push
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          AMD64: ${{ steps.amd64.outputs.digest }}
          ARM64: ${{ steps.arm64.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # One SBOM per platform manifest: the inventories differ, so a single
      # amd64 SBOM cannot describe the arm64 packages. Provenance covers the index.
      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.amd64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.arm64.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Create or publish the GitHub Release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN does not trigger another release workflow; image publishing stays in this run.
        run: python3 tools/publish_release.py
      - name: Update latest for the current stable release
        if: ${{ steps.github-release.outputs.latest == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest_release" = "$RELEASE_TAG" ]; then
            # Point latest at the attested multi-platform index; nothing is rebuilt.
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
            printf 'latest now points to %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipping latest: $RELEASE_TAG is not the current stable release."
          fi
      # GHCR creates a package private even for a public repository, and a published
      # image is useless to an installation if nobody can pull it anonymously.
      - name: Require the published package to be publicly pullable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY%/*}
          package=${GITHUB_REPOSITORY#*/}
          repository="${owner,,}/${package,,}"
          api_path="users/${owner,,}/packages/container/${package,,}"
          if [ "$(gh api "$api_path" --jq .visibility 2>/dev/null)" != public ]; then
            # Needs package administration; the one-time manual change is the fallback.
            gh api --method PATCH "$api_path" -f visibility=public >/dev/null 2>&1 || true
          fi
          if curl --fail --silent --output /dev/null "https://ghcr.io/token?scope=repository:${repository}:pull"; then
            echo "ghcr.io/$repository is publicly pullable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::ghcr.io/$repository is not public. Set the package visibility to public once in its package settings; later releases inherit it."
          exit 1
