[project]
name = "house-bills"
version = "0.0.1"
description = "Swedish utility invoice extraction and review"
requires-python = ">=3.14,<3.15"
dependencies = ["pdfplumber==0.11.10"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "reportlab>=4.4,<5", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
