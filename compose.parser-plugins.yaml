# Optional read-only parser code mount. Requires an existing operator-owned host
# directory outside APP_DATA_PATH; it is never created automatically.
services:
  app:
    environment:
      HOUSE_BILLS_PARSER_PLUGINS: /parsers
    volumes:
      - type: bind
        source: "${APP_PARSER_PATH:?Set an existing operator-owned parser code directory}"
        target: /parsers
        read_only: true
        bind:
          create_host_path: false
